<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Valley - MindAR & A-Frame</title>

  <!-- Core Libraries -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  
  <!-- THE GIF SHADER PLUGIN (Required for animated GIFs) -->
  <script src="https://cdn.jsdelivr.net/gh/mayognaise/aframe-gif-shader/dist/aframe-gif-shader.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <script>
    // 1. "SCALE-IN" ANIMATION
    AFRAME.registerComponent('scale-in', {
      schema: { delay: { type: 'number', default: 0 } },
      init: function () {
        this.baseScale = { ...this.el.getAttribute('scale') };
        this.el.setAttribute('scale', '0.001 0.001 0.001');
        
        const target = this.el.closest('[mindar-image-target]');
        if (target) {
          target.addEventListener('targetFound', () => {
            this.el.setAttribute('animation', {
              property: 'scale',
              from: '0.001 0.001 0.001',
              to: `${this.baseScale.x} ${this.baseScale.y} ${this.baseScale.z}`,
              dur: 1000,
              easing: 'easeOutElastic',
              delay: this.data.delay
            });
          });
          target.addEventListener('targetLost', () => {
            this.el.removeAttribute('animation');
            this.el.setAttribute('scale', '0.001 0.001 0.001');
          });
        }
      }
    });

    // 2. "POP-UP" ANIMATION 
    AFRAME.registerComponent('pop-up', {
      schema: { delay: { type: 'number', default: 0 } },
      init: function () {
        this.el.setAttribute('rotation', '-90 0 0'); 
        
        const target = this.el.closest('[mindar-image-target]');
        if (target) {
          target.addEventListener('targetFound', () => {
            this.el.setAttribute('animation', {
              property: 'rotation',
              from: '-90 0 0',
              to: '0 0 0', 
              dur: 1000,
              easing: 'easeOutElastic',
              delay: this.data.delay
            });
          });
          target.addEventListener('targetLost', () => {
             this.el.removeAttribute('animation');
             this.el.setAttribute('rotation', '-90 0 0');
          });
        }
      }
    });
  </script>
</head>

<body>
  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="img-board" src="./assets/Board.png">
      <img id="img-platform" src="./assets/Platform.png">
      <img id="img-cloud" src="./assets/Cloud.png">
      <img id="img-grass1" src="./assets/Grass1.png">
      <img id="img-grass2" src="./assets/Grass2.png">
      <img id="img-grass3" src="./assets/Grass3.png">
      <img id="img-tree1" src="./assets/Tree1.png">
      <img id="img-tree2" src="./assets/Tree2.png">
      
      <!-- ADDED: The Animated Road GIF -->
      <img id="gif-road" src="./assets/Road.gif" crossorigin="anonymous">
      
      <a-asset-item id="model-milo" src="./assets/MiloRun.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- THE MASTER TILT -->
      <a-entity rotation="90 0 0" position="0 0 0">
        
        <!-- BASE LEVEL (The Wooden Platform) -->
        <a-image scale-in="delay: 0" src="#img-platform" position="0 0 0" rotation="-90 0 0" width="0.8" height="0.4" material="transparent: true; alphaTest: 0.5"></a-image>
        
        <!-- THE MOVING ROAD -->
        <!-- 
          Placed at position="0 0.005 0" so it sits precisely on top of the platform.
          Uses geometry and shader:gif to play the animation.
        -->
        <a-entity 
          scale-in="delay: 50" 
          geometry="primitive: plane; width: 0.8; height: 0.8;" 
          material="shader: gif; src: #gif-road; transparent: true; alphaTest: 0.5" 
          position="0 0.005 0" 
          rotation="-90 0 0">
        </a-entity>

        <!-- PUSHED CLOUD BEHIND EVERYTHING -->
        <a-image scale-in="delay: 200" src="#img-cloud" position="-0.15 0.5 -0.3" rotation="0 0 0" width="0.5" height="0.3" material="transparent: true; alphaTest: 0.5"></a-image>

        <!-- THE SIGN BOARD -->
        <a-entity pop-up="delay: 400" position="0.15 0.125 0.25" rotation="-90 0 0">
          <a-image src="#img-board" width="0.3" height="0.25" material="transparent: true; alphaTest: 0.5"></a-image>
        </a-entity>

        <!-- TREES -->
        <a-entity pop-up="delay: 500" position="-0.3 0.3 -0.2" rotation="-90 0 0">
          <a-image src="#img-tree1" width="0.4" height="0.6" material="transparent: true; alphaTest: 0.5"></a-image>
        </a-entity>
        <a-entity pop-up="delay: 600" position="0.35 0.275 -0.1" rotation="-90 0 0">
          <a-image src="#img-tree2" width="0.35" height="0.55" material="transparent: true; alphaTest: 0.5"></a-image>
        </a-entity>

        <!-- GRASS CLUSTERS -->
        <a-entity pop-up="delay: 700" position="0.25 0.075 0.08" rotation="-90 0 0">
          <a-image src="#img-grass1" width="-0.2" height="0.15" material="transparent: true; alphaTest: 0.5"></a-image>
        </a-entity>
        <a-entity pop-up="delay: 750" position="-0.4 0.06 0" rotation="-90 0 0">
          <a-image src="#img-grass2" width="0.15" height="0.12" material="transparent: true; alphaTest: 0.5"></a-image>
        </a-entity>
        <a-entity pop-up="delay: 800" position="0.3 0.1 0.1" rotation="-90 0 0">
          <a-image src="#img-grass3" width="-0.18" height="0.2" material="transparent: true; alphaTest: 0.5"></a-image>
        </a-entity>

        <!-- MILO'S WRAPPER -->
        <a-entity pop-up="delay: 1000" position="0 0 0.1" rotation="-90 0 0">
          
          <a-gltf-model 
            src="#model-milo" 
            position="-0.2 -0.3 -0.1" 
            rotation="0 -25 0" 
            scale="0.25 0.25 0.25" 
            animation-mixer="clip: rigAction; loop: repeat;">
          </a-gltf-model>

        </a-entity>

      </a-entity>
    </a-entity>

    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="1 2 1" intensity="0.5"></a-light>

  </a-scene>
</body>
</html>
